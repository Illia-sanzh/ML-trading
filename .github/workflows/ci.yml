name: Run tests
on: 
    pull_request:
        branches: [ main ]
    push:
        branches: [ main, article_integration ]
jobs:
    test:
        runs-on: ubuntu-latest
        environment: Actions testing env
        env:
            FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        steps:
            - uses: actions/checkout@v3
            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: '3.13'
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install pytest python-dotenv
            - name: Run tests
              run: |
                  pytest article_integration/tests/unit --maxfail=1 --disable-warnings -q